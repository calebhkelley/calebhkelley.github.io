---
layout: default
---
{%- if page.header.overlay_image -%}
<section class="page-hero" style="background-image: url('{{ page.header.overlay_image | relative_url }}')">
  <div class="page-hero__overlay"></div>
  <div class="page-hero__content">
    <h1>{{ page.title }}</h1>
  </div>
</section>
{%- endif -%}

<div class="page-content page-content--wide">
  <div class="container">
    {{ content }}
  </div>
</div>
