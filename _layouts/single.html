---
layout: default
---
{%- if page.header.overlay_image -%}
<section class="page-hero" style="background-image: url('{{ page.header.overlay_image | relative_url }}'); background-position: {{ page.header.overlay_position | default: 'center' }}">
  <div class="page-hero__overlay"></div>
  <div class="page-hero__content">
    <h1>{{ page.title }}</h1>
  </div>
</section>
{%- endif -%}

<div class="page-content">
  <div class="container">
    <div class="page-layout">
      {%- if page.author_profile -%}
      <aside class="sidebar">
        {%- include author-profile.html -%}
      </aside>
      {%- endif -%}
      <article class="page-body">
        {{ content }}
      </article>
    </div>
  </div>
</div>
